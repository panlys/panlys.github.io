<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vortex Biotech | Device Health</title>
    <!-- External Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700&display=swap');
        
        :root {
            --vortex-mint: #00F2B5;
            --vortex-amber: #FFB800;
            --vortex-red: #FF4B4B;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Using dvh (Dynamic Viewport Height) so the layout fills the screen and does not scroll */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #020202;
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100dvh; 
            width: 100vw;
            overflow: hidden; /* Lock scroll so layout stays fixed within the screen */
            position: fixed; /* Prevent rubber-banding on iOS */
        }

        /* Atmospheric Glow Background */
        .ambient-glow {
            position: fixed;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 160vw;
            height: 100dvh;
            border-radius: 100%;
            filter: blur(140px);
            opacity: 0.15;
            z-index: 0;
            transition: background-color 1.2s ease;
            pointer-events: none;
        }

        /* Toblerone Shape Styling */
        .toblerone {
            width: 0;
            height: 0;
            border-left: clamp(60px, 10vw, 100px) solid transparent;
            border-right: clamp(60px, 10vw, 100px) solid transparent;
            border-bottom: clamp(104px, 17vw, 173px) solid currentColor;
            filter: drop-shadow(0 0 60px rgba(0, 242, 181, 0.5));
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        /* Glass Highlight for 3D effect */
        .toblerone::after {
            content: '';
            position: absolute;
            top: 40%;
            left: -20%;
            width: 60%;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(60deg);
            filter: blur(1px);
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Heartbeat Animation */
        @keyframes heartbeat {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.85; }
            100% { transform: scale(1); opacity: 1; }
        }
        .anim-pulse { animation: heartbeat 4s infinite ease-in-out; }
    </style>
</head>
<body class="flex flex-col items-center justify-center">

    <div id="ambient" class="ambient-glow bg-[#00F2B5]"></div>

    <!-- Main Container: fixed to viewport height so there is no scroll -->
    <div class="relative z-10 w-full h-[100dvh] max-w-5xl mx-auto flex flex-col p-6 sm:p-10 md:p-12 lg:p-16 justify-between items-center safe-area-inset">
        
        <!-- Header -->
        <header class="w-full flex flex-row justify-between items-start pt-safe">
            <div class="flex flex-col items-start text-left">
                <h1 class="text-2xl sm:text-3xl font-black tracking-tighter leading-none text-white">VORTEX</h1>
                <span id="brand-sub" class="text-[8px] sm:text-[10px] tracking-[0.45em] text-[#00F2B5] font-bold uppercase transition-colors duration-500">Biotech Systems</span>
            </div>
            <div class="text-right flex flex-col items-end">
                <p class="text-[10px] sm:text-xs font-semibold opacity-90 uppercase tracking-widest">Executive Office</p>
                <p class="text-[8px] sm:text-[10px] text-white/30 tracking-widest uppercase mt-0.5">Unit VT-0922 • London NW</p>
            </div>
        </header>

        <!-- Hero Area -->
        <main class="w-full flex-grow flex flex-col items-center justify-center cursor-pointer" onclick="cycleStatus()">
            <div id="glow-container" class="anim-pulse mb-8 sm:mb-12">
                <div id="led-tube" class="toblerone text-[#00F2B5] mx-auto"></div>
            </div>
            
            <div class="text-center space-y-4">
                <h2 id="status-label" class="text-6xl sm:text-8xl md:text-9xl font-extralight tracking-[0.2em] uppercase text-[#00F2B5] leading-none transition-colors duration-700">Active</h2>
                <div class="flex items-center justify-center gap-3 bg-white/[0.04] px-6 py-3 rounded-full border border-white/5 backdrop-blur-lg mx-auto inline-flex shadow-2xl">
                    <i data-lucide="shield-check" id="status-icon" class="w-4 h-4 sm:w-5 sm:h-5 text-[#00F2B5]/70 transition-colors duration-500"></i>
                    <p id="status-desc" class="text-[9px] sm:text-[10px] md:text-xs text-white/60 font-medium tracking-[0.3em] uppercase">Atmospheric Purification Optimized</p>
                </div>
            </div>
        </main>

        <!-- Metrics Grid: Scaled down slightly for mobile to fit without scroll -->
        <section class="w-full grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-6 mb-8">
            <div class="metric-card p-4 sm:p-6 rounded-[2rem] flex flex-col items-center text-center">
                <div class="flex items-center gap-2 mb-1 opacity-40">
                    <i data-lucide="activity" class="w-3 h-3"></i>
                    <span class="text-[7px] sm:text-[9px] uppercase tracking-widest font-bold">Air Flow</span>
                </div>
                <p class="text-sm sm:text-xl font-light tracking-tight">Optimized</p>
            </div>
            <div class="metric-card p-4 sm:p-6 rounded-[2rem] flex flex-col items-center text-center">
                <div class="flex items-center gap-2 mb-1 opacity-40">
                    <i data-lucide="zap" class="w-3 h-3"></i>
                    <span class="text-[7px] sm:text-[9px] uppercase tracking-widest font-bold">Intensity</span>
                </div>
                <p class="text-sm sm:text-xl font-light tracking-tight">99.4%</p>
            </div>
            <div class="metric-card p-4 sm:p-6 rounded-[2rem] flex flex-col items-center text-center">
                <div class="flex items-center gap-2 mb-1 opacity-40">
                    <i data-lucide="info" class="w-3 h-3"></i>
                    <span class="text-[7px] sm:text-[9px] uppercase tracking-widest font-bold">Uptime</span>
                </div>
                <p class="text-sm sm:text-xl font-light tracking-tight">2,480h</p>
            </div>
            <div class="metric-card p-4 sm:p-6 rounded-[2rem] flex flex-col items-center text-center">
                <div class="flex items-center gap-2 mb-1 opacity-40">
                    <i data-lucide="settings" class="w-3 h-3"></i>
                    <span class="text-[7px] sm:text-[9px] uppercase tracking-widest font-bold">Ambient</span>
                </div>
                <p class="text-sm sm:text-xl font-light tracking-tight">21.5°C</p>
            </div>
        </section>

        <!-- Footer / Cloud Sync -->
        <footer class="w-full pb-safe flex flex-col gap-4">
            <div class="flex justify-between items-center text-[8px] sm:text-[9px] font-bold tracking-[0.4em] uppercase opacity-40 px-2">
                <span id="sync-text">Secure Cloud Sync</span>
                <span id="timestamp">SYNCING...</span>
            </div>
            <div class="w-full h-[1px] bg-white/10 rounded-full overflow-hidden">
                <div id="sync-progress" class="h-full bg-white/40 transition-all duration-[10000ms] ease-linear" style="width: 0%"></div>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();

        const THEMES = {
            healthy: { color: '#00F2B5', label: 'ACTIVE', desc: 'Purification Optimized', icon: 'shield-check' },
            service: { color: '#FFB800', label: 'SERVICE', desc: 'Maintenance Required', icon: 'alert-triangle' },
            offline: { color: '#FF4B4B', label: 'OFFLINE', desc: 'Hardware Error', icon: 'wifi-off' }
        };

        let currentStatus = 'healthy';

        function setStatus(state) {
            const config = THEMES[state];
            const tube = document.getElementById('led-tube');
            const ambient = document.getElementById('ambient');
            const label = document.getElementById('status-label');
            const desc = document.getElementById('status-desc');
            const iconEl = document.getElementById('status-icon');
            const brandSub = document.getElementById('brand-sub');

            tube.style.borderBottomColor = config.color;
            tube.style.filter = `drop-shadow(0 0 60px ${config.color}88)`;
            ambient.style.backgroundColor = config.color;
            label.innerText = config.label;
            label.style.color = config.color;
            desc.innerText = config.desc;
            brandSub.style.color = config.color;

            const newIcon = document.createElement('i');
            newIcon.setAttribute('data-lucide', config.icon);
            newIcon.id = 'status-icon';
            newIcon.className = 'w-4 h-4 sm:w-5 sm:h-5 transition-colors duration-500 opacity-80';
            newIcon.style.color = config.color;
            iconEl.parentNode.replaceChild(newIcon, iconEl);
            lucide.createIcons();
        }

        function cycleStatus() {
            const states = ['healthy', 'service', 'offline'];
            const idx = states.indexOf(currentStatus);
            currentStatus = states[(idx + 1) % states.length];
            setStatus(currentStatus);
        }

        function heartbeat() {
            const progress = document.getElementById('sync-progress');
            const time = document.getElementById('timestamp');
            const now = new Date();
            time.innerText = now.toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            progress.style.transition = 'none';
            progress.style.width = '0%';
            void progress.offsetWidth;
            progress.style.transition = 'width 10s linear';
            progress.style.width = '100%';
        }

        setInterval(heartbeat, 10000);
        heartbeat();
        setStatus('healthy');

        // Prevent typical touch-scrolling "bounce" on iOS
        document.body.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
