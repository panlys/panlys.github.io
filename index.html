<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanLys</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fcfcfc;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="flex flex-col items-center gap-12">
        <!-- Logo Section -->
        <div class="flex flex-col items-center">
            <img src="logo.png" alt="PanLys Logo" class="w-48 h-auto">
        </div>

        <!-- Action Button -->
        <a href="https://www.panlys.com" 
           class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 px-10 rounded-full transition duration-200 shadow-xl shadow-blue-100 flex items-center gap-2 group">
            PanLys.com
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:translate-x-1 transition-transform">
                <path d="M5 12h14m-7-7 7 7-7 7"/>
            </svg>
        </a>
    </div>

</body>
</html>
